name: Bug report / False positive
description: Valca flagged something it shouldn't, missed something it should, or crashed
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities in Valca itself do not belong here.**
        Use [private vulnerability reporting](https://github.com/PranLabs/valca/security/advisories/new).
        False positives and false negatives are correctness bugs — they belong here, and they are welcome.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of bug?
      options:
        - False positive (flagged something safe)
        - False negative (missed something unsafe)
        - Crash or error
        - Wrong / unhelpful fix text
        - Other
    validations: {required: true}
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: VGL-D001
  - type: textarea
    id: snippet
    attributes:
      label: Minimal snippet
      description: The smallest input that reproduces this. **Redact any real secrets, hostnames or internal paths.**
      render: yaml
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected vs what happened
    validations: {required: true}
  - type: textarea
    id: output
    attributes:
      label: Valca output
      description: Output of `valca scan <path>`. Redact anything sensitive.
      render: shell
  - type: input
    id: version
    attributes:
      label: Valca version / commit
    validations: {required: true}
