[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valca"
version = "0.6.1"
description = "AI coding security co-pilot — blocks insecure code at generation time"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Prem Kumar Akula"}]
requires-python = ">=3.11"
dependencies = []
keywords = ["security", "devsecops", "docker", "ai", "claude", "static-analysis", "linter"]

[project.urls]
Homepage = "https://valca.io"
Source = "https://github.com/PranLabs/valca"
Issues = "https://github.com/PranLabs/valca/issues"

# Both commands are intentionally exposed during the vigilsec → valca transition.
# `vigil` MUST remain until at least 1.0: plugin/hook.sh invokes it, and dropping it
# would silently stop enforcement on every existing install — a fail-open outcome.
[project.scripts]
valca = "valca.cli:main"
vigil = "valca.cli:main"
valca-mcp = "valca.mcp_server:main"

# The MCP server is the only part of Valca that needs a third-party package, so
# it is an extra rather than a dependency. `dependencies = []` above is a
# security property of the core — installing a scanner should not pull a
# dependency tree into the environment being scanned.
[project.optional-dependencies]
mcp = ["mcp>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
# B101: assert in tests; B404/B603/B607: vigil intentionally shells out to trivy/pip-audit/npm
# with hardcoded command names and list-form args — no shell injection possible
# B110: bare except in telemetry.py is intentional — telemetry must never crash a scan
skips = ["B101", "B404", "B603", "B607", "B110"]
