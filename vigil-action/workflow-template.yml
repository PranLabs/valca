name: Valca Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  vigil:
    name: Valca Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required for SARIF upload to GitHub Code Scanning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Valca
        run: pip install valca --quiet

      - name: Scan with Valca
        id: vigil
        run: |
          valca scan . --no-color
        # Remove `continue-on-error` to block PRs on CRITICAL/HIGH findings
        continue-on-error: true

      - name: Generate SARIF report
        if: always()
        run: valca scan . --format sarif > valca-results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: valca-results.sarif
          category: vigil
